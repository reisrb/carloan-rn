<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Gestão de financiamento de veículos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CarLoan" />
    <link rel="apple-touch-icon" href="/icon-apple.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CarLoan</title>
    <style id="expo-reset">
      html, body { height: 100%; max-width: 100%; overflow: hidden; touch-action: pan-x pan-y; background-color: #000000; }
      @media (prefers-color-scheme: light) { html, body { background-color: #F2F2F7; } }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; overflow: hidden; max-width: 100%; touch-action: pan-x pan-y; }
      * { box-sizing: border-box; }
      input, textarea { max-width: 100%; }
      #sb-cover { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 44px); background-color: #000000; z-index: 99999; pointer-events: none; }
      @media (prefers-color-scheme: light) { #sb-cover { background-color: #F2F2F7; } }
    </style>
  </head>
  <body>
    <div id="sb-cover"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
